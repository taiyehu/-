<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圆环游戏 · 联机 Demo</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/movement.css"></head>
<body><header><div><h1>圆环游戏 <span>DEMO</span></h1><p>三队联机 · 移动牌与战斗表</p></div><div id="roomLabel"></div></header>
<main id="lobby" class="lobby"><section class="panel intro"><h2>进入游戏</h2><p>裁判可创建普通房间，或创建带固定牌序的四标签测试房间。房间状态保存在当前服务器内存中。</p><div class="join"><label>初始金钱 <input id="initialMoney" type="number" min="0" max="1000000" step="1" value="0"></label><label>初始收入 <input id="initialIncome" type="number" min="0" max="1000000" step="1" value="10"></label></div><div class="join"><input id="seed" placeholder="测试种子，默认 demo-01" value="demo-01" maxlength="80" aria-label="测试种子"></div><div class="join"><button id="createTest">创建四标签测试房间</button><button id="create">创建普通房间</button></div><div class="join"><input id="code" placeholder="六位房间码" maxlength="6" autocomplete="off"><select id="seat"><option value="A">A 队</option><option value="B">B 队</option><option value="C">C 队</option></select><button id="join">加入房间</button></div><p id="lobbyError" class="error"></p></section></main>
<main id="game" hidden><section id="scoreboard" class="scoreboard"></section><div class="workspace"><section class="panel mapPanel"><div class="sectionHead"><div><h2>地图</h2><p>选一张移动牌，直接点击地图上高亮的可到达终点。</p></div><span id="myRole"></span></div><div class="mapWrap"><img src="/map.svg" alt="圆环地图"><div id="markers"></div><div id="destinations"></div><div id="roundStatus"></div></div><div id="turnControls"></div><div id="route" class="route"></div><div id="choices" class="choices"></div><div id="cards" class="cards"></div></section><section class="panel tablePanel"><div class="sectionHead"><div><h2>战斗表</h2><p id="filterNote"></p></div><span id="sync">同步中</span></div><div id="pendingAction"></div><div id="battles"></div><div class="tableScroll"><table><thead><tr><th>轮次</th><th>A 队</th><th>B 队</th><th>C 队</th></tr></thead><tbody id="rows"></tbody></table></div><div id="testTools"></div><div id="hostTools"></div><h3>操作记录</h3><div id="log" class="log"></div></section></div></main>
<div id="roundIntro" aria-live="polite"></div>
<div id="effectIntro" aria-live="polite"></div>
<div id="cardPreview"></div>
<script src="/routes.js"></script><script src="/app.js"></script></body></html>
